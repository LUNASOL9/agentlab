[project]
name = "agentlab-backend"
version = "0.1.0"
description = "AgentLab API - LLM agent testbed backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
